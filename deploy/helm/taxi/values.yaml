fullnameOverride: taxi

image:
  repository: 100.93.86.88:30980/taxi-backend
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 1
  service:
    type: NodePort
    port: 8000
    nodePort: 30080

controlRoom:
  enabled: true
  replicas: 1
  image:
    repository: 100.93.86.88:30980/taxi-control-room
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    nodePort: 30081

redis:
  image: redis:7-alpine
  storage:
    size: 1Gi

mongodb:
  # mongo:5.0+ requires AVX CPU support; this cluster's nodes lack it, so we
  # pin to the last official image built without an AVX requirement.
  image: mongo:4.4
  storage:
    size: 1Gi

env:
  appEnv: production
  dbName: nimbus
  jwtSecret: change-me-to-a-long-random-secret
  stripeApiKey: ""
  stripeWebhookSecret: ""
  sentryDsn: ""
  rateLimitWindowSec: "60"
  rateLimitMaxRequests: "120"
  # Comma-separated frontend origins for CORS. Includes the control_room
  # dashboard's NodePort origin so browser requests from it are allowed.
  corsOriginsCsv: "http://localhost:8081,http://localhost:19006,http://127.0.0.1:8081,http://100.93.86.88:30081"
