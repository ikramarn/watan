apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taxi.fullname" . }}-secrets
  labels:
    {{- include "taxi.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.env.jwtSecret | quote }}
  STRIPE_API_KEY: {{ .Values.env.stripeApiKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.env.stripeWebhookSecret | quote }}
