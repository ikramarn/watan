apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "taxi.fullname" . }}-mongodb-pvc
  labels:
    {{- include "taxi.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mongodb.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taxi.fullname" . }}-mongodb
  labels:
    {{- include "taxi.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mongodb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mongodb
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "taxi.fullname" . }}-mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taxi.fullname" . }}-mongodb
  labels:
    {{- include "taxi.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
