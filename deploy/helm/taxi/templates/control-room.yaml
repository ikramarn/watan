{{- if .Values.controlRoom.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taxi.fullname" . }}-control-room
  labels:
    {{- include "taxi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlRoom.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: control-room
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-room
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: control-room
          image: {{ printf "%s:%s" .Values.controlRoom.image.repository .Values.controlRoom.image.tag }}
          imagePullPolicy: {{ .Values.controlRoom.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taxi.fullname" . }}-control-room
  labels:
    {{- include "taxi.labels" . | nindent 4 }}
spec:
  type: {{ .Values.controlRoom.service.type }}
  selector:
    app.kubernetes.io/component: control-room
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.controlRoom.service.port }}
      targetPort: 80
      nodePort: {{ .Values.controlRoom.service.nodePort }}
{{- end }}
